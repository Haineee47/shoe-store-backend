name: shoe-store-backend

services:
  mysql:
    image: mysql:8.4.5
    container_name: shoe-store-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - shoe_store_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=localhost --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - shoe_store_network

volumes:
  shoe_store_mysql_data:
    name: shoe_store_mysql_data

networks:
  shoe_store_network:
    name: shoe_store_network
    driver: bridge
