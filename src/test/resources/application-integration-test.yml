spring:
  config:
    activate:
      on-profile: integration-test

  main:
    banner-mode: "off"

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.shoestore: INFO
    org.flywaydb: INFO
    org.testcontainers: INFO
