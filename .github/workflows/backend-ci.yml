name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Oracle JDK 21.0.6
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 21.0.6
          java-package: jdk
          cache: maven
          cache-dependency-path: pom.xml
          check-latest: false

      - name: Verify Java toolchain
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Verify Docker runtime
        run: |
          docker version
          docker info

      - name: Run full verification
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify executable JAR
        run: |
          test -f target/shoe-store-backend-0.0.1-SNAPSHOT.jar
          jar tf target/shoe-store-backend-0.0.1-SNAPSHOT.jar \
            | grep "BOOT-INF/classes/com/shoestore/ShoeStoreBackendApplication.class"
